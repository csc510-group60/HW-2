name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install autopep8 pyflakes pylint pytest

    - name: Run AutoPep8
      run: |
        autopep8 --in-place --aggressive --aggressive src/**/*.py

    - name: Run Pyflakes
      run: |
        pyflakes src/**/*.py

    - name: Run Pylint
      run: |
        pylint src/**/*.py

    - name: Run Tests
      run: |
        pytest
