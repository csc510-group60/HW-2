name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install autopep8 pyflakes pylint pytest

    - name: Run AutoPep8
      run: |
        if ls ./*.py 1> /dev/null 2>&1; then
          autopep8 --in-place --aggressive --aggressive ./*.py
        else
          echo "No Python files found to format."
        fi

    - name: Run Pyflakes
      run: |
        if ls ./*.py 1> /dev/null 2>&1; then
          pyflakes ./*.py
        else
          echo "No Python files found to check."
        fi

    - name: Run Pylint
      run: |
        if ls ./*.py 1> /dev/null 2>&1; then
          pylint ./*.py
        else
          echo "No Python files found to lint."
        fi

    - name: Run Tests
      run: |
        if ls ./*.py 1> /dev/null 2>&1 && grep -q "def test_" ./*.py; then
          pytest
        else
          echo "No test cases found to execute."
        fi
